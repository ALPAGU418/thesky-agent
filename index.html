<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base x402 AI Agent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0052FF; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #ffffff; color: #000; border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h2 { margin-top: 0; color: #0052FF; }
    textarea { width: 100%; height: 80px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; background: #0052FF; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #003cd6; }
    .logs { background: #f4f4f6; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 12px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Base x402 AI Agent</h2>
    <p style="font-size: 14px; color: #666;">HTTP 402 Tabanlı Mikro Ödemeli Yapay Zeka Entegrasyonu</p>
    
    <label for="prompt">Sorgunuz:</label>
    <textarea id="prompt" placeholder="Base ağında x402 işlemi gerçekleştir..."></textarea>
    
    <button onclick="sendRequest()">Sorgula (0.001 USDC)</button>

    <div class="logs" id="logs">Sistem hazır. İstek bekleniyor...</div>
  </div>

  <script>
    function log(msg) {
      const logsEl = document.getElementById("logs");
      logsEl.innerText += "\n" + msg;
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    async function sendRequest() {
      const prompt = document.getElementById("prompt").value;
      if (!prompt) return alert("Lütfen bir sorgu girin.");

      log(`[Bilgi] İstek atılıyor: ${prompt}`);
      
      try {
        const res = await fetch("/api/v1/agent/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        if (res.status === 402) {
          const data = await res.json();
          log(`[x402] 402 Ödeme Gerekli! App Code: ${data.extensions?.builder_code?.a}`);
          log(`[x402] Ödeme onaylanıyor ve işlem tamamlanıyor...`);
          
          // Yapay onay simülasyonu
          setTimeout(() => {
            log(`[Başarılı] Ödeme yerleşimi gerçekleşti! Yanıt alındı.`);
          }, 1000);
        } else {
          const data = await res.json();
          log(`[Yanıt]: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        log(`[Hata]: ${err.message}`);
      }
    }
  </script>
</body>
</html>
